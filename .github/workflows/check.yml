name: Compile check

# Builds every branch except main for the iOS Simulator without publishing an app release, reports
# compiler errors as annotations, then runs the game in a simulator and publishes screenshots of the
# demo states (MyApp/Engine/Demo.swift) to the "ci-screens" pre-release.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator)
        run: |
          set -o pipefail
          xcodebuild -project MyApp.xcodeproj -scheme MyApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "(error|fatal error):" build.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -80 > errors.txt || true
          echo "errors: $(wc -l < errors.txt)"
          split -l 12 errors.txt chunk_ || true
          n=0
          for f in chunk_*; do
            [ -f "$f" ] || continue
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Compiler errors $n::$msg"
          done

      - name: Screenshots
        timeout-minutes: 20
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ids = [x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'] in ('iPhone 16', 'iPhone 16 Pro', 'iPhone 15')]
          ids = ids or [x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(ids[-1])")
          echo "device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/MyApp.app
          mkdir -p shots
          DEMOS="tut1 tut3 tut7 tut11b tut12 tut14 tut17 tut18 kitchen scroll special fx chefs chestopen chefdetail shop research supply heritage supplyreveal tasks choice rush rushintro league market contracts contract event inspector festival upgrades goals profile settings teaser levelup story map nablus hebron jaffa"
          i=0
          for d in $DEMOS; do
            i=$((i+1))
            name=$(printf "%02d_%s" $i $d)
            t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
            t 30 xcrun simctl launch --terminate-running-process "$UDID" com.wardapp.falafel -demo "$d" > /dev/null || echo "launch failed $d"
            sleep 4
            t 30 xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null 2>&1 || echo "shot failed $d"
            [ -f "shots/$name.png" ] && sips -Z 900 "shots/$name.png" > /dev/null
          done
          for f in ~/Library/Logs/DiagnosticReports/MyApp*; do
            [ -f "$f" ] && cp "$f" "shots/crash_$(basename "$f").txt"
          done
          ls shots

      - name: Publish status, errors and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots
          if [ -s errors.txt ]; then
            echo "$GITHUB_SHA failure" > status.txt
            cp errors.txt shots/errors.txt
          else
            echo "$GITHUB_SHA success" > status.txt
          fi
          (cd shots && ls) > files.txt
          gh release delete ci-screens --yes --cleanup-tag || true
          gh release create ci-screens status.txt files.txt shots/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "CI screenshots (للمطوّر)" \
            --notes "Simulator screenshots from the latest compile check of ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Not an app build."
